<!doctype html>
<!--
  Akira Arcade phone controller (stage 2).
  Served by PhoneControllerServer on the iPad (HTTP :8765). Talks to it over WebSocket (:8766):
    → { "t": "join", "k": "<token from ?k=>" }  then  { "m": <16-bit button mask> }
    ← { "t": "hello", "slot": 0|1 }  or  { "t": "full" } / { "t": "denied" }
  Mask bits: up 0, down 1, left 2, right 3, a 4, b 5, x 6, y 7, l1 8, r1 9,
             start 10, select 11, l2 12, r2 13, menu 14.
  One file, no build step, no outside requests.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16161a">
<title>Akira Arcade</title>
<style>
  :root {
    --bg: #16161a; --shell: #222228; --key: #33333b; --key-on: #4b4b56;
    --ink: #f2efe8; --muted: #8d8b95; --p1: #2f6fd0; --p2: #d33b3b;
    --a: #e0533d; --b: #e9a23b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 600 15px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  }
  #slot { padding: 4px 12px; border-radius: 999px; background: var(--key); font-weight: 800; letter-spacing: .04em; }
  #slot[data-slot="0"] { background: var(--p1); }
  #slot[data-slot="1"] { background: var(--p2); }
  #status { color: var(--muted); font-size: 13px; flex: 1; }
  #menu { width: 44px; height: 32px; border-radius: 10px; background: var(--key); font-size: 18px; }

  #pad {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 56px max(24px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  #dpad {
    justify-self: center; position: relative;
    width: min(44vw, 72vh, 230px); aspect-ratio: 1;
  }
  #dpad .arm { position: absolute; background: var(--key); border-radius: 10px; }
  #dpad .h { left: 0; right: 0; top: 33.3%; height: 33.4%; }
  #dpad .v { top: 0; bottom: 0; left: 33.3%; width: 33.4%; }
  #dpad .dir { position: absolute; width: 33.4%; height: 33.4%; display: grid; place-items: center; color: var(--muted); font-size: 18px; border-radius: 10px; }
  #dpad .dir.on { background: var(--key-on); color: var(--ink); }
  #dpad [data-dir="up"] { left: 33.3%; top: 0; }
  #dpad [data-dir="down"] { left: 33.3%; bottom: 0; }
  #dpad [data-dir="left"] { left: 0; top: 33.3%; }
  #dpad [data-dir="right"] { right: 0; top: 33.3%; }

  #middle { display: flex; gap: 14px; align-self: end; padding-bottom: 8px; }
  .pill { min-width: 74px; height: 30px; border-radius: 999px; background: var(--key); color: var(--muted); font-size: 12px; letter-spacing: .08em; }

  #face { justify-self: center; position: relative; width: min(44vw, 72vh, 230px); aspect-ratio: 1; }
  .round {
    position: absolute; width: 44%; aspect-ratio: 1; border-radius: 50%;
    font-size: 26px; font-weight: 900; color: #1b1b1f; box-shadow: 0 6px 0 #0007;
  }
  #b { left: 4%; bottom: 10%; background: var(--b); }
  #a { right: 4%; top: 10%; background: var(--a); }

  button { font: inherit; border: 0; padding: 0; color: inherit; touch-action: none; }
  button.on, .round.on { transform: translateY(4px); box-shadow: none; filter: brightness(1.15); }
  .pill.on { background: var(--key-on); color: var(--ink); }

  #msg { position: fixed; inset: 0; z-index: 3; display: none; place-items: center; text-align: center; padding: 32px; background: var(--bg); }
  #msg.show { display: grid; }
  #msg h1 { font-size: 24px; margin: 0 0 10px; }
  #msg p { color: var(--muted); margin: 0 auto; max-width: 32ch; font-weight: 500; }

  #rotate { display: none; }
  @media (orientation: portrait) {
    #rotate { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; text-align: center; padding: 32px; background: var(--bg); color: var(--muted); }
  }
</style>
</head>
<body>
<div id="bar">
  <span id="slot">Akira Arcade</span>
  <span id="status">Connecting…</span>
  <button id="menu" type="button" data-bit="menu" aria-label="Menu">☰</button>
</div>

<div id="pad">
  <div id="dpad" aria-label="Directional pad">
    <div class="arm h"></div><div class="arm v"></div>
    <div class="dir" data-dir="up">▲</div>
    <div class="dir" data-dir="down">▼</div>
    <div class="dir" data-dir="left">◀</div>
    <div class="dir" data-dir="right">▶</div>
  </div>
  <div id="middle">
    <button class="pill" type="button" data-bit="select">SELECT</button>
    <button class="pill" type="button" data-bit="start">START</button>
  </div>
  <div id="face">
    <button id="b" class="round" type="button" data-bit="b">B</button>
    <button id="a" class="round" type="button" data-bit="a">A</button>
  </div>
</div>

<div id="msg"><div><h1 id="msgTitle"></h1><p id="msgBody"></p></div></div>
<div id="rotate"><p>Turn your phone sideways to play.</p></div>

<script>
(() => {
  "use strict";

  const BIT = {
    up: 1 << 0, down: 1 << 1, left: 1 << 2, right: 1 << 3,
    a: 1 << 4, b: 1 << 5, x: 1 << 6, y: 1 << 7,
    l1: 1 << 8, r1: 1 << 9, start: 1 << 10, select: 1 << 11,
    l2: 1 << 12, r2: 1 << 13, menu: 1 << 14,
  };
  const DIRS = BIT.up | BIT.down | BIT.left | BIT.right;
  const WS_PORT = 8766;
  const REPEAT_MS = 250;

  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get("k") || "";

  let ws = null;
  let mask = 0;
  let lastSent = -1;
  let stopped = false;
  let retryDelay = 500;

  // Each active pointer holds the bits it is pressing: a button's bit, or the D-pad's direction bits.
  const pointers = new Map();

  function say(title, body) {
    $("msgTitle").textContent = title;
    $("msgBody").textContent = body;
    $("msg").classList.add("show");
  }

  function setStatus(text) { $("status").textContent = text; }

  function send(force) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (!force && mask === lastSent) return;
    lastSent = mask;
    ws.send(JSON.stringify({ m: mask }));
  }

  function paint() {
    for (const el of document.querySelectorAll("[data-bit]")) {
      el.classList.toggle("on", (mask & BIT[el.dataset.bit]) !== 0);
    }
    for (const el of document.querySelectorAll("[data-dir]")) {
      el.classList.toggle("on", (mask & BIT[el.dataset.dir]) !== 0);
    }
  }

  // D-pad: the angle from its centre picks one of eight directions; a small dead zone in the middle.
  function dpadBits(x, y) {
    const r = $("dpad").getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < r.width * 0.12) return 0;
    const sector = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
    switch ((sector + 8) % 8) {
      case 0: return BIT.right;
      case 1: return BIT.right | BIT.down;
      case 2: return BIT.down;
      case 3: return BIT.down | BIT.left;
      case 4: return BIT.left;
      case 5: return BIT.left | BIT.up;
      case 6: return BIT.up;
      case 7: return BIT.up | BIT.right;
    }
    return 0;
  }

  function onDown(event) {
    const button = event.target.closest("[data-bit]");
    const dpad = event.target.closest("#dpad");
    if (!button && !dpad) return;
    event.preventDefault();
    try { event.target.setPointerCapture(event.pointerId); } catch (_) {}
    pointers.set(event.pointerId, dpad ? { dpad: true, bits: dpadBits(event.clientX, event.clientY) } : { dpad: false, bits: BIT[button.dataset.bit] });
    flatten();
  }

  function onMove(event) {
    const held = pointers.get(event.pointerId);
    if (!held || !held.dpad) return;
    event.preventDefault();
    held.bits = dpadBits(event.clientX, event.clientY);
    flatten();
  }

  function onUp(event) {
    if (!pointers.delete(event.pointerId)) return;
    event.preventDefault();
    flatten();
  }

  // Combine every held pointer into one mask and send it if it changed.
  function flatten() {
    let next = 0;
    for (const held of pointers.values()) next |= held.bits;
    if (next === mask) return;
    mask = next;
    paint();
    send(false);
    if (navigator.vibrate && mask) navigator.vibrate(8);
  }

  function releaseAll() {
    pointers.clear();
    flatten();
  }

  document.addEventListener("pointerdown", onDown, { passive: false });
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp, { passive: false });
  document.addEventListener("pointercancel", onUp, { passive: false });
  document.addEventListener("contextmenu", (event) => event.preventDefault());
  document.addEventListener("dblclick", (event) => event.preventDefault());
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
  window.addEventListener("blur", releaseAll);

  // While anything is held, repeat the mask so the iPad knows the phone is still there.
  setInterval(() => { if (mask) send(true); }, REPEAT_MS);

  // Keep the screen on where the browser allows it (needs a secure context, so often not on plain http).
  async function keepAwake() {
    try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (_) {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
  keepAwake();

  function connect() {
    if (stopped) return;
    setStatus("Connecting…");
    ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}/`);
    lastSent = -1;

    ws.onopen = () => {
      retryDelay = 500;
      ws.send(JSON.stringify({ t: "join", k: token }));
    };

    ws.onmessage = (event) => {
      let message;
      try { message = JSON.parse(event.data); } catch (_) { return; }
      if (message.t === "hello") {
        const slot = Number(message.slot) || 0;
        $("slot").textContent = `P${slot + 1}`;
        $("slot").dataset.slot = String(slot);
        setStatus("Connected");
        $("msg").classList.remove("show");
        send(true);
      } else if (message.t === "full") {
        stopped = true;
        say("Already 2 players", "Two phones are playing. Ask one of them to close their page, then scan again.");
      } else if (message.t === "denied") {
        stopped = true;
        say("This link has expired", "Open Phone Controller on the iPad and scan the new QR code.");
      }
    };

    ws.onclose = () => {
      ws = null;
      if (stopped) return;
      setStatus("Reconnecting…");
      $("slot").textContent = "Akira Arcade";
      delete $("slot").dataset.slot;
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 4000);
    };
  }

  if (!token) {
    say("Scan the QR code", "Open Phone Controller from the pause menu on the iPad and scan its QR code.");
  } else {
    connect();
  }

  // For automated tests.
  window.__akira = { get mask() { return mask; }, BIT };
})();
</script>
</body>
</html>
